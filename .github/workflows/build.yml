name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if present)
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Unzipping $f"
            unzip -o "$f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Locate project root
        id: locate
        run: |
          if [ -f "app/build.gradle.kts" ] || [ -f "app/build.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "PhoenixFire/app/build.gradle.kts" ] || [ -f "PhoenixFire/app/build.gradle" ]; then
            echo "dir=PhoenixFire" >> "$GITHUB_OUTPUT"
          else
            echo "Could not locate app/build.gradle(.kts) - check zip structure" >&2
            find . -maxdepth 3 -name "build.gradle*"
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixFire-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
